spring.application.name=backend

# =========================================================
# DATABASE
# =========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/prosno}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# =========================================================
# SPRING AI / GROQ
# =========================================================
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b


# =========================================================
# GITHUB OAUTH2
# =========================================================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id


# =========================================================
# HTTP SESSION / CROSS-DOMAIN COOKIE
# =========================================================
server.servlet.session.cookie.name=PROSNO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

# Render terminates HTTPS at the proxy/load balancer.
server.forward-headers-strategy=framework


# =========================================================
# SPRING SESSION JDBC
# =========================================================
spring.session.jdbc.initialize-schema=always
spring.session.timeout=7d


# =========================================================
# PGVECTOR
# =========================================================
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=384
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE


# =========================================================
# APPLICATION SETTINGS
# =========================================================
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cookie-domain=${COOKIE_DOMAIN:}

app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:prosno-local-encrypt-key-change-me}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:deadbeefcafebabe}

app.indexing.max-file-bytes=102400
app.indexing.chunk-size=250
app.indexing.chunk-overlap=50
app.github.api-delay-ms=50


# =========================================================
# LOGGING
# =========================================================
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} [req:%X{correlationId:-system}] - %msg%n

logging.level.root=INFO
logging.level.prosno=INFO


# =========================================================
# ACTUATOR - HEALTH / READINESS
# =========================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never